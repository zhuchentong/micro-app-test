packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vue: ^3.5.44
  vue-router: ^5.4.0
  wujie: ^2.1.0
  pinia: ^4.1.0
  "@vizejs/vite-plugin": ^0.608.0
  "@vizejs/vite-plugin-musea": ^0.608.0
  oxlint-plugin-vize: ^0.608.0
  vize: ^0.608.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
